name: classsync
description: "ClassSync — Offline-First Classroom Assessment Platform"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  # State management
  provider: ^6.1.2
  # QR code generation for offline session pairing
  qr_flutter: ^4.1.0
  # Date formatting and utilities
  intl: ^0.19.0
  # Material Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
