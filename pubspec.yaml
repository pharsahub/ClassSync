name: classsync
description: "ClassSync — Offline-First Classroom Assessment Platform"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  # State management
  flutter_riverpod: ^2.5.1
  # Crypto
  cryptography: ^2.7.0
  crypto: ^3.0.3
  # Local Storage & Database
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  path_provider: ^2.1.3
  path: ^1.9.0
  # QR code generation and scanning
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  # P2P Transport (Android Nearby Connections)
  nearby_connections: ^4.1.1
  # CSV export
  csv: ^6.0.0
  # Date formatting and utilities
  intl: ^0.19.0
  # Cloud Sync HTTP client
  http: ^1.2.1
  # Material Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

